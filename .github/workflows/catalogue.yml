name: Generate Movie Zone Catalogue

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: movie-zone-catalogue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U yt-dlp

      - name: Generate catalogue
        env:
          MAX_NEW_VIDEOS: 500
        run: python generate_catalog.py

      - name: Commit updated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog.json

          if git diff --cached --quiet; then
            echo "No catalogue changes to commit."
          else
            git commit -m "Update Movie Zone video catalogue"
            git push origin HEAD:main
          fi
